<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CKEditor</title>

  <script src="https://cdn.ckeditor.com/4.22.1/full-all/ckeditor.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    #preview {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 20px;
      min-height: 100px;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
    }

    
    .video-resize {
      display: inline-block;
      resize: both;
      overflow: hidden;
      width: 400px;
      height: 225px;
      border: 1px dashed #aaa;
    }

    .video-resize iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

<h2>Soạn nội dung</h2>

<textarea id="editor"></textarea>

<br>
<button onclick="submitContent()">Submit</button>

<h3>Kết quả hiển thị</h3>
<div id="preview"></div>

<script>

CKEDITOR.replace('editor', {
  height: 300,
  extraPlugins: 'image2,embed,autoembed',
  embed_provider: '//ckeditor.iframe.ly/api/oembed?url={url}&callback={callback}'
});


function submitContent() {
  let data = CKEDITOR.instances.editor.getData();


  data = data.replace(
    /(<div[^>]*data-oembed-url[^>]*>[\s\S]*?<\/div>)/g,
    '<div class="video-resize">$1</div>'
  );

  document.getElementById('preview').innerHTML = data;
}
</script>

</body>
</html>
